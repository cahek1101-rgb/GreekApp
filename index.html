<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ελληνικά — карточки к собеседованию</title>
<meta name="description" content="Карточки для изучения греческих слов и фраз с русской транскрипцией.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ελληνικά">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0E2A47">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
<link rel="icon" type="image/png" sizes="180x180" href="./icon-180.png">
<style>
  :root{
    --sea:#0E2A47;
    --sea-2:#143654;
    --plaster:#FBF8F3;
    --ink:#16222E;
    --ink-soft:#5A6A78;
    --blue:#2E7FBF;
    --gold:#C89A3C;
    --green:#3FA37A;
    --amber:#D9944A;
    --grey:#D8DEE4;
    --serif:"Palatino Linotype",Palatino,"Iowan Old Style","Book Antiqua",Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--sea);
    color:var(--plaster);
    font-family:var(--sans);
    font-size:16px;
    line-height:1.45;
    min-height:100vh;
    min-height:100dvh;
    padding-bottom:calc(40px + env(safe-area-inset-bottom));
  }
  #app{max-width:460px;margin:0 auto;padding:env(safe-area-inset-top) max(14px,env(safe-area-inset-right)) 24px max(14px,env(safe-area-inset-left))}

  /* ── шапка ── */
  .top{display:flex;align-items:center;gap:12px;padding:18px 2px 14px;min-height:60px}
  .top h1{font-family:var(--serif);font-size:22px;font-weight:600;margin:0;letter-spacing:.2px;flex:1}
  .top .sub{font-size:12.5px;color:#8FA6BC;margin:2px 0 0;font-family:var(--sans)}
  .iconbtn{
    background:rgba(255,255,255,.08);border:0;color:var(--plaster);
    width:38px;height:38px;border-radius:50%;font-size:17px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;flex:none;
  }
  .iconbtn:active{background:rgba(255,255,255,.18)}
  .iconbtn:focus-visible,.deck:focus-visible,.ans:focus-visible,.again:focus-visible,.toggle:focus-visible,.card:focus-visible{
    outline:3px solid var(--gold);outline-offset:3px;
  }

  /* ── список колод ── */
  .deck{
    background:var(--plaster);color:var(--ink);
    border-radius:14px;padding:14px 16px 12px;margin-bottom:10px;
    cursor:pointer;border:1px solid rgba(0,0,0,.06);
    display:block;width:100%;text-align:left;font:inherit;
  }
  .deck:active{transform:scale(.994)}
  .deck-name{font-family:var(--serif);font-size:18px;font-weight:600;margin:0 0 1px}
  .deck-meta{font-size:12.5px;color:var(--ink-soft);margin:0 0 9px}
  .bar{height:7px;border-radius:4px;background:var(--grey);overflow:hidden;display:flex}
  .bar i{display:block;height:100%}
  .bar .m{background:var(--green)}
  .bar .r{background:var(--amber)}
  .bar .l{background:#9AA7B2}

  .section-note{font-size:13px;color:#8FA6BC;margin:2px 4px 14px;line-height:1.5}

  /* ── карточка ── */
  .card{
    background:var(--plaster);color:var(--ink);
    border-radius:16px;min-height:290px;
    padding:52px 22px 26px;position:relative;
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    cursor:pointer;text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.28);
  }
  .badge{
    position:absolute;top:12px;right:12px;
    font-size:11px;letter-spacing:.4px;font-weight:600;
    padding:5px 10px;border-radius:20px;
  }
  .speakbtn{
    position:absolute;top:10px;left:10px;z-index:2;
    background:#E7EEF4;color:var(--sea);width:36px;height:36px;font-size:16px;
  }
  .b-mastered{background:#D9F0E4;color:#1F7350}
  .b-review{background:#FAE8D2;color:#9C5F1B}
  .b-learning{background:#E5EAEF;color:#4C5D6B}
  .b-new{background:#EDE7DA;color:#7A6A44}

  .gr{font-family:var(--serif);font-size:34px;line-height:1.25;font-weight:600;margin:0}
  .gr.small{font-size:27px}
  .ru-front{font-size:26px;font-family:var(--sans);font-weight:500;margin:0}
  .hint{margin:16px 0 0;font-size:13.5px;color:var(--ink-soft)}

  .tr{font-size:19px;color:var(--blue);margin:8px 0 0;font-weight:500}
  .ru{font-size:19px;margin:10px 0 0;line-height:1.35}
  .rule{height:1px;background:rgba(0,0,0,.09);margin:16px 0 12px;width:100%}
  .forms{width:100%;text-align:left}
  .forms h4{font-size:12.5px;font-weight:600;color:var(--ink-soft);margin:0 0 7px;letter-spacing:.2px}
  .form{display:flex;gap:9px;align-items:baseline;padding:4px 0;font-size:15px;border-bottom:1px solid rgba(0,0,0,.05)}
  .form:last-child{border-bottom:0}
  .form b{font-family:var(--serif);font-weight:600;flex:none}
  .form span{color:var(--ink-soft);font-size:13.5px}
  .form em{display:block;color:var(--blue);font-style:normal;font-size:12.5px}
  .ex{width:100%;text-align:left;margin-top:12px;font-size:14.5px;line-height:1.5}
  .ex b{font-family:var(--serif);font-weight:600;display:block}
  .ex span{color:var(--ink-soft)}
  .togo{width:100%;text-align:left;margin:14px 0 0;font-size:12.5px;color:var(--ink-soft)}
  .form span i{font-style:normal;color:#8A97A3}

  /* ── ответы ── */
  .answers{margin-top:12px;display:flex;flex-direction:column;gap:8px}
  .ans{
    border:0;border-radius:12px;padding:15px;font-size:16px;font-weight:600;
    font-family:var(--sans);cursor:pointer;
  }
  .yes{background:#CFEBDD;color:#1B6B4A}
  .no{background:#F7D9D6;color:#9B3B33}
  .ans:active{filter:brightness(.95)}

  /* ── прогресс в практике ── */
  .stats{margin-top:16px}
  .statline{font-size:13px;color:#A9BCCE;margin:0 0 4px}
  .stats .bar{margin-bottom:11px;height:8px;background:rgba(255,255,255,.12)}

  .counter{font-size:13px;color:#8FA6BC;text-align:center;margin:10px 0 0}

  /* ── настройки/справка ── */
  .panel{background:var(--sea-2);border-radius:14px;padding:16px;margin-bottom:12px}
  .panel h3{font-family:var(--serif);font-size:17px;margin:0 0 10px;font-weight:600}
  .panel p{font-size:14px;color:#C3D2DF;margin:0 0 10px;line-height:1.55}
  .panel p:last-child{margin-bottom:0}
  .panel b{font-family:var(--serif);color:#fff}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:14.5px}
  .row:last-child{border-bottom:0}
  .toggle{
    background:rgba(255,255,255,.12);border:0;color:var(--plaster);
    padding:7px 13px;border-radius:20px;font-size:13.5px;cursor:pointer;font-family:var(--sans);
  }
  .toggle.on{background:var(--blue);color:#fff}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .actions .toggle{border-radius:10px;padding:11px 10px}
  .danger{color:#F0A9A2}
  .dump{
    width:100%;height:74px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.14);
    border-radius:9px;color:#9FB3C6;font-size:11px;padding:9px;font-family:ui-monospace,Menlo,monospace;
    resize:none;margin:0 0 4px;
  }

  .done{background:var(--plaster);color:var(--ink);border-radius:16px;padding:30px 22px;text-align:center}
  .done h2{font-family:var(--serif);font-size:24px;margin:0 0 8px}
  .done p{color:var(--ink-soft);font-size:15px;margin:0 0 18px}
  .again{background:var(--blue);color:#fff;border:0;border-radius:12px;padding:14px 22px;font-size:16px;font-weight:600;cursor:pointer;width:100%}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

D.unshift({id:"core", name:"Ядро — 31 слово", note:"Минимум, который покрывает большую часть твоего текста",
  cards:COREIDS.map(x=>ALL[x]).filter(Boolean)});

/* ═══════════ ПРОГРЕСС ═══════════ */
const KEY="greek_flashcards_v1";
let progress={};
let opts={dir:"gr-ru", tr:true};
let store="память";   // где реально сохраняется прогресс

function hasLocal(){
  try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); return true; }catch(e){ return false; }
}
async function load(){
  let raw=null;
  try{
    if(window.storage&&window.storage.get){
      const r=await window.storage.get(KEY);
      if(r&&r.value){ raw=r.value; store="Claude"; }
      else store="Claude";
    }
  }catch(e){}
  if(raw===null&&hasLocal()){
    const l=localStorage.getItem(KEY);
    if(l) raw=l;
    if(store==="память") store="этот браузер";
  }
  if(raw){
    try{
      const p=JSON.parse(raw);
      progress=cleanProgress(p.progress);
      opts=Object.assign(opts,cleanOpts(p.opts));
    }catch(e){}
  }
}
function cleanProgress(input){
  const out={};
  if(!input||typeof input!=="object"||Array.isArray(input)) return out;
  Object.entries(input).forEach(([el,p])=>{
    if(!ALL[el]||!p||typeof p!=="object") return;
    const seen=Math.max(0,Math.floor(Number(p.seen)||0));
    const streak=Math.max(0,Math.min(4,Math.floor(Number(p.streak)||0)));
    if(seen) out[el]={seen,streak};
  });
  return out;
}
function cleanOpts(input){
  if(!input||typeof input!=="object") return {};
  return {
    dir:input.dir==="ru-gr"?"ru-gr":"gr-ru",
    tr:input.tr!==false
  };
}
function payload(){ return JSON.stringify({version:2,progress,opts}); }
function save(){
  const data=payload();
  // localStorage пишется сразу: iOS может остановить PWA сразу после ухода с экрана.
  try{ localStorage.setItem(KEY,data); }catch(e){}
  try{
    if(window.storage&&window.storage.set){
      Promise.resolve(window.storage.set(KEY,data)).catch(()=>{});
    }
  }catch(e){}
}
function st(el){
  const p=progress[el];
  if(!p||!p.seen) return "new";
  if(p.streak>=4) return "mastered";
  if(p.streak>=1) return "review";
  return "learning";
}
function togo(el){          // сколько правильных ответов осталось до «освоено»
  const p=progress[el];
  const s=p?p.streak:0;
  return Math.max(0,4-s);
}
function counts(deck){
  const c={mastered:0,review:0,learning:0,new:0};
  deck.cards.forEach(x=>c[st(x.el)]++);
  return c;
}

/* ═══════════ ПОДСКАЗКИ ═══════════ */
function flash(msg){
  const n=document.createElement("div");
  n.textContent=msg;
  n.style.cssText="position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#143654;color:#FBF8F3;padding:11px 16px;border-radius:10px;font-size:13.5px;max-width:88%;text-align:center;z-index:9;box-shadow:0 6px 20px rgba(0,0,0,.4)";
  document.body.appendChild(n);
  setTimeout(()=>n.remove(),2600);
}

function speakGreek(text){
  if(!("speechSynthesis" in window)||typeof SpeechSynthesisUtterance==="undefined"){
    flash("Озвучивание недоступно на этом устройстве");
    return;
  }
  window.speechSynthesis.cancel();
  const utterance=new SpeechSynthesisUtterance(text.replace(/[;…]/g,""));
  utterance.lang="el-GR";
  utterance.rate=.82;
  window.speechSynthesis.speak(utterance);
}

async function copyBackup(){
  const data=payload();
  try{
    await navigator.clipboard.writeText(data);
    flash("Резервная копия скопирована");
  }catch(e){
    const field=document.getElementById("dump");
    field.removeAttribute("readonly");
    field.select();
    const ok=document.execCommand&&document.execCommand("copy");
    field.setAttribute("readonly","");
    flash(ok?"Резервная копия скопирована":"Выдели строку и скопируй её вручную");
  }
}

function importBackup(){
  const text=window.prompt("Вставь сюда строку резервной копии:","");
  if(text===null) return;
  try{
    const p=JSON.parse(text.trim());
    if(!p||typeof p!=="object"||!p.progress) throw 0;
    progress=cleanProgress(p.progress);
    opts=Object.assign(opts,cleanOpts(p.opts));
    save();
    flash("Прогресс восстановлен");
    render();
  }catch(e){
    flash("Строка не распознана — вставь копию целиком");
  }
}

/* ═══════════ СОСТОЯНИЕ ═══════════ */
let view="decks", returnView="decks", deck=null, queue=[], idx=0, flipped=false, session={y:0,n:0};

function esc(s){
  return String(s)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

function shuffle(items){
  const out=items.slice();
  for(let i=out.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [out[i],out[j]]=[out[j],out[i]];
  }
  return out;
}

function startDeck(d){
  deck=d;
  const order=["learning","review","new","mastered"];
  queue=order.flatMap(status=>shuffle(d.cards.filter(card=>st(card.el)===status)));
  idx=0; flipped=false; session={y:0,n:0}; view="practice"; render();
}
function answer(ok){
  const c=queue[idx];
  const p=progress[c.el]||{streak:0,seen:0};
  const wasMastered = (p.streak||0)>=4;
  p.seen=(p.seen||0)+1;
  if(ok) p.streak=Math.min(4,(p.streak||0)+1);
  else   p.streak= wasMastered ? 1 : 0;   // освоенное падает в повторение, остальное — в работу
  progress[c.el]=p; save();
  ok?session.y++:session.n++;
  idx++; flipped=false; render();
  window.scrollTo({top:0});
}

/* ═══════════ РЕНДЕР ═══════════ */
function barHTML(c,total){
  const w=n=>total? (n/total*100).toFixed(2)+"%" : "0%";
  return `<div class="bar"><i class="m" style="width:${w(c.mastered)}"></i><i class="r" style="width:${w(c.review)}"></i><i class="l" style="width:${w(c.learning)}"></i></div>`;
}

function render(){
  const app=document.getElementById("app");
  if(view==="decks"){
    let total=0,mast=0;
    D.slice(1).forEach(d=>{total+=d.cards.length; mast+=counts(d).mastered});
    app.innerHTML=`
      <div class="top">
        <div style="flex:1">
          <h1>Ελληνικά</h1>
          <p class="sub">Освоено ${mast} из ${total} слов твоего текста</p>
        </div>
        <button class="iconbtn" id="help" aria-label="Как читать">?</button>
        <button class="iconbtn" id="set" aria-label="Настройки">⚙</button>
      </div>
      ${D.map((d,i)=>{
        const c=counts(d);
        return `<button class="deck" data-i="${i}">
          <p class="deck-name">${esc(d.name)}</p>
          <p class="deck-meta">${c.mastered} из ${d.cards.length} освоено · ${esc(d.note)}</p>
          ${barHTML(c,d.cards.length)}
        </button>`;
      }).join("")}
      <p class="section-note">Зелёный — освоено, оранжевый — на повторении, серый — в работе. Один правильный ответ переводит слово в повторение, ещё три подряд — в освоенные. Ошибка возвращает освоенное слово в повторение, остальные — в работу.</p>`;
    app.querySelectorAll(".deck").forEach(b=>b.onclick=()=>startDeck(D[+b.dataset.i]));
    document.getElementById("help").onclick=()=>{returnView="decks";view="help";render()};
    document.getElementById("set").onclick=()=>{view="settings";render()};
    return;
  }

  if(view==="help"){
    app.innerHTML=`
      <div class="top"><button class="iconbtn" id="back" aria-label="Назад">‹</button><h1>Как читать</h1></div>
      <div class="panel">
        <h3>Ударение</h3>
        <p>В греческом ударение всегда обозначено значком в самом слове: <b>επανάσταση</b>. В транскрипции оно отмечено чёрточкой: эпана́стаси. Гласные без ударения <b>не</b> редуцируются — «о» всегда «о», не «а».</p>
      </div>
      <div class="panel">
        <h3>Буквы, у которых нет русского аналога</h3>
        <p><b>θ</b> — глухой межзубный, как <i>th</i> в английском think. В транскрипции пишу «т», но язык между зубами: <b>θέλω</b> те́ло, <b>κάθε</b> ка́те.</p>
        <p><b>δ</b> — звонкий межзубный, как <i>th</i> в английском this. Пишу «д»: <b>δεν</b> ден.</p>
        <p><b>γ</b> перед ε и ι звучит как русское «й»: <b>έγινε</b> э́йине, <b>εκλογές</b> эклойе́с. В остальных случаях — южнорусское «г»: <b>οργάνωση</b> орга́носи.</p>
        <p><b>χ</b> — «х»: <b>μάχη</b> ма́хи.</p>
      </div>
      <div class="panel">
        <h3>Сочетания</h3>
        <p><b>ευ</b> = «эв» или «эф», <b>αυ</b> = «ав» или «аф» — зависит от следующей буквы: <b>ελευθερία</b> элефтери́а, <b>ναυμαχία</b> навмахи́а.</p>
        <p><b>ντ</b> = «д/нд», <b>μπ</b> = «б/мб», <b>τσ</b> = «ц»: <b>Σπέτσες</b> спе́цес, <b>αντιπολίτευση</b> андиполи́тевси.</p>
        <p><b>ου</b> = «у», а <b>ει, οι, η, υ</b> — все читаются как «и».</p>
      </div>
      <div class="panel">
        <h3>Артикль — часть слова</h3>
        <p>Существительные учи только с артиклем: <b>ο</b> — мужской, <b>η</b> — женский, <b>το</b> — средний. Он подсказывает окончания в остальных падежах.</p>
      </div>
      <div class="panel">
        <h3>Окончания прилагательных</h3>
        <p>Прилагательное подстраивается под род существительного, к которому относится. На карточке дана мужская форма, а на обороте — все три: <b>ο ελληνικός</b> (м. р.), <b>η ελληνική</b> (ж. р.), <b>το ελληνικό</b> (ср. р.).</p>
        <p>Поэтому в тексте у тебя <b>το ελληνικό κράτος</b> — государство среднего рода, значит и прилагательное на -ό. А <b>η Ελληνική Επανάσταση</b> — революция женского рода, значит -ή.</p>
      </div>
      <div class="panel">
        <h3>Как считается прогресс</h3>
        <p>Новое слово после первого правильного ответа уходит в повторение. Ещё три правильных ответа подряд — и оно становится освоенным. Ошибка на освоенном слове возвращает его в повторение, на любом другом — в работу.</p>
      </div>`;
    document.getElementById("back").onclick=()=>{view=returnView;render()};
    return;
  }

  if(view==="settings"){
    const done=Object.keys(progress).length;
    app.innerHTML=`
      <div class="top"><button class="iconbtn" id="back" aria-label="Назад">‹</button><h1>Настройки</h1></div>
      <div class="panel">
        <div class="row"><span>Направление</span>
          <button class="toggle on" id="dir">${opts.dir==="gr-ru"?"Греческий → русский":"Русский → греческий"}</button></div>
        <div class="row"><span>Транскрипция на обороте</span>
          <button class="toggle ${opts.tr?"on":""}" id="trn">${opts.tr?"Показывается":"Скрыта"}</button></div>
      </div>
      <div class="panel">
        <h3>Резервная копия</h3>
        <p>Прогресс сохраняется в: ${store}. Изучалось слов: ${done}. Сохрани копию в заметках — по ней можно восстановить прогресс на другом устройстве.</p>
        <textarea id="dump" class="dump" readonly>${esc(payload())}</textarea>
        <div class="actions">
          <button class="toggle on" id="copy">Скопировать</button>
          <button class="toggle" id="imp">Восстановить</button>
        </div>
      </div>
      <div class="panel">
        <h3>Установка на iPhone</h3>
        <p>Открой сайт в Safari, нажми «Поделиться», выбери «На экран “Домой”» и нажми «Добавить».</p>
      </div>
      <div class="panel">
        <div class="row"><span class="danger">Сбросить весь прогресс</span>
          <button class="toggle" id="reset">Сбросить</button></div>
      </div>
      <p class="section-note">Направление «русский → греческий» сложнее и ближе к реальному разговору: ты вспоминаешь слово, а не узнаёшь его.</p>`;
    document.getElementById("back").onclick=()=>{view="decks";render()};
    document.getElementById("dir").onclick=()=>{opts.dir=opts.dir==="gr-ru"?"ru-gr":"gr-ru";save();render()};
    document.getElementById("trn").onclick=()=>{opts.tr=!opts.tr;save();render()};
    document.getElementById("dump").onclick=copyBackup;
    document.getElementById("copy").onclick=copyBackup;
    document.getElementById("imp").onclick=importBackup;
    document.getElementById("reset").onclick=()=>{
      if(!window.confirm("Сбросить весь прогресс? Отменить это действие нельзя.")) return;
      progress={};save();flash("Прогресс сброшен");render();
    };
    return;
  }

  /* практика */
  const c=counts(deck);
  const total=deck.cards.length;
  const head=`
    <div class="top">
      <button class="iconbtn" id="back" aria-label="Назад">‹</button>
      <div style="flex:1"><h1 style="font-size:19px">${esc(deck.name)}</h1></div>
      <button class="iconbtn" id="help2" aria-label="Как читать">?</button>
    </div>`;
  const stats=`
    <div class="stats">
      <p class="statline">Освоено ${c.mastered} из ${total}</p>${barHTML({mastered:c.mastered,review:0,learning:0},total)}
      <p class="statline">На повторении ${c.review} из ${total}</p>${barHTML({mastered:0,review:c.review,learning:0},total)}
      <p class="statline">В работе ${c.learning} из ${total}</p>${barHTML({mastered:0,review:0,learning:c.learning},total)}
    </div>`;

  if(idx>=queue.length){
    app.innerHTML=head+`
      <div class="done">
        <h2>Круг пройден</h2>
        <p>Узнал ${session.y}, не узнал ${session.n}. Слова, которые не дались, встанут в начало следующего круга.</p>
        <button class="again" id="again">Пройти ещё раз</button>
      </div>`+stats;
    document.getElementById("again").onclick=()=>startDeck(deck);
    document.getElementById("back").onclick=()=>{view="decks";render()};
    document.getElementById("help2").onclick=()=>{returnView="practice";view="help";render()};
    return;
  }

  const card=queue[idx];
  const status=st(card.el);
  const badge={mastered:["b-mastered","Освоено"],review:["b-review","Повторение"],learning:["b-learning","В работе"],new:["b-new","Новое"]}[status];
  const grFirst = opts.dir==="gr-ru";
  const long = card.el.length>18;

  let inner;
  if(!flipped){
    inner = grFirst
      ? `<p class="gr ${long?"small":""}">${esc(card.el)}</p><p class="hint">Нажми, чтобы увидеть перевод</p>`
      : `<p class="ru-front">${esc(card.ru)}</p><p class="hint">Нажми, чтобы увидеть греческое слово</p>`;
  }else{
    const forms = (card.f&&card.f.length) ? `
      <div class="rule"></div>
      <div class="forms"><h4>Формы и сочетания</h4>${card.f.map(x=>
        `<div class="form"><b>${esc(x[0])}</b><span>${esc(x[1])}${x[2]?`<em>${esc(x[2])}</em>`:""}</span></div>`).join("")}</div>` : "";
    const ex = card.ex ? `<div class="rule"></div><div class="ex"><b>${esc(card.ex[0])}</b><span>${esc(card.ex[1])}</span></div>` : "";
    const left = togo(card.el);
    const togoText = left===0 ? "Слово освоено" : `До «освоено» ещё ${left} ${left===1?"правильный ответ":"правильных ответа"} подряд`;
    inner = `
      <p class="gr ${long?"small":""}" style="margin:0">${esc(card.el)}</p>
      ${opts.tr?`<p class="tr">${esc(card.tr)}</p>`:""}
      <p class="ru">${esc(card.ru)}</p>
      ${forms}${ex}
      <p class="togo">${togoText}</p>`;
  }

  app.innerHTML = head + `
    <div class="card" id="cardbox" role="button" tabindex="0" aria-label="${flipped?"Карточка открыта":"Открыть карточку"}" style="${flipped?"justify-content:flex-start;padding-top:54px":""}">
      <span class="badge ${badge[0]}">${badge[1]}</span>
      ${flipped?`<button class="iconbtn speakbtn" id="speak" aria-label="Прослушать произношение">▶</button>`:""}
      ${inner}
    </div>
    ${flipped?`<div class="answers">
        <button class="ans yes" id="yes">Знал это слово</button>
        <button class="ans no" id="no">Не знал</button>
      </div>`:""}
    <p class="counter">${idx+1} из ${queue.length}</p>
    ${stats}`;

  document.getElementById("back").onclick=()=>{view="decks";render()};
  document.getElementById("help2").onclick=()=>{returnView="practice";view="help";render()};
  const box=document.getElementById("cardbox");
  box.onclick=()=>{
    if(!flipped){ flipped=true; render(); }
  };
  box.onkeydown=e=>{
    if(!flipped&&(e.key==="Enter"||e.code==="Space")){
      e.preventDefault();flipped=true;render();
    }
  };
  const y=document.getElementById("yes"); if(y) y.onclick=()=>answer(true);
  const n=document.getElementById("no"); if(n) n.onclick=()=>answer(false);
  const s=document.getElementById("speak"); if(s) s.onclick=e=>{e.stopPropagation();speakGreek(card.el)};
}

/* клавиатура для десктопа */
document.addEventListener("keydown",e=>{
  if(view!=="practice"||idx>=queue.length) return;
  if(e.code==="Space"){e.preventDefault(); if(!flipped){flipped=true;render()}}
  if(flipped&&(e.key==="1"||e.key==="ArrowRight")) answer(true);
  if(flipped&&(e.key==="2"||e.key==="ArrowLeft")) answer(false);
});

if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){
  navigator.serviceWorker.register("./sw.js").catch(()=>{});
}

window.addEventListener("pagehide",save);
load().then(render);
</script>
</body>
</html>
